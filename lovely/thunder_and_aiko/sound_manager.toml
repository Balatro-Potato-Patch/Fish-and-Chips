[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

[[patches]]
[patches.pattern]
target = 'functions/misc_functions.lua'
pattern = "    G.ARGS.play_sound.sound_code = sound_code"
position = "before"
payload = '''    G.ARGS.play_sound.fac_is_miku_sound = (SMODS.Sounds[sound_code] or {}).fac_is_miku_sound'''
match_indent = true


[[patches]]
[patches.pattern]
target = 'engine/sound_manager.lua'
pattern = "  s.created_on_state = args.state"
position = "before"
payload = '''s.fac_is_miku_sound = args.fac_is_miku_sound'''
match_indent = true


[[patches]]
[patches.pattern]
target = 'engine/sound_manager.lua'
pattern = "        elseif request.type == 'modulate' then "
position = "before"
payload = '''elseif request.type == 'fac_th_ai_stop' then 
    FAC_TH_AI_STOP_SOUND()
'''
match_indent = true


[[patches]]
[patches.pattern]
target = 'engine/sound_manager.lua'
pattern = "function STOP_AUDIO()"
position = "before"
payload = '''function FAC_TH_AI_STOP_SOUND()
    for _, source in pairs(SOURCES) do
        for _, s in pairs(source) do
            if s.sound:isPlaying() and s.fac_is_miku_sound then
                s.sound:stop()
            end
        end
    end
end
'''
match_indent = true