[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

# Fish And Chips logo menu draw stuff

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
if self.SPLASH_LOGO then self.SPLASH_LOGO:remove(); self.SPLASH_LOGO = nil end
'''
position = "after"
payload = '''
if self.SPLASH_FAC_LOGO then self.SPLASH_FAC_LOGO:remove(); self.SPLASH_FAC_LOGO = nil end -- Added by Fish And Chips
'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
if G.SPLASH_LOGO then
    love.graphics.push()
    G.SPLASH_LOGO:translate_container()
    G.SPLASH_LOGO:draw()
    love.graphics.pop()
end
'''
position = "after"
payload = '''

-- Added by Fish And Chips
if G.SPLASH_FAC_LOGO then
    love.graphics.push()
    G.SPLASH_FAC_LOGO:translate_container()

    local rotate_mod = 0.05*math.sin(1.219*G.TIMERS.REAL) + 0.00*math.sin((G.TIMERS.REAL)*math.pi*5)*(1 - (G.TIMERS.REAL - math.floor(G.TIMERS.REAL)))^2
    G.SPLASH_FAC_LOGO.T.r = rotate_mod

    if not G.SPLASH_FAC_LOGO.states.drag.is then
        local scale_mod = 0.07 + 0.02*math.sin(1.8*G.TIMERS.REAL) + 0.00*math.sin((G.TIMERS.REAL - math.floor(G.TIMERS.REAL))*math.pi*14)*(1 - (G.TIMERS.REAL - math.floor(G.TIMERS.REAL)))^3

        G.SPLASH_FAC_LOGO:draw_shader('dissolve', 0, nil, nil, G.SPLASH_FAC_LOGO,scale_mod, nil, nil, 0.1 + 0.03*math.sin(1.8*G.TIMERS.REAL),nil, 0.6)
        G.SPLASH_FAC_LOGO:draw_shader('dissolve', nil, nil, nil, G.SPLASH_FAC_LOGO, scale_mod, nil)
    end

    add_to_drawhash(G.SPLASH_FAC_LOGO)

    love.graphics.pop()
end
'''
match_indent = true
times = 1

# Credits vortex
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
local card = Card(  card_pos.x + G.ROOM.T.w/2 - G.CARD_W*card_size/2,
                    card_pos.y + G.ROOM.T.h/2 - G.CARD_H*card_size/2,
                    card_size*G.CARD_W, card_size*G.CARD_H, pseudorandom_element(G.P_CARDS), G.P_CENTERS.c_base)
if math.random() > 0.8 then card.sprite_facing = 'back'; card.facing = 'back' end
'''
position = "at"
payload = '''
local card
if FishAndChips and FishAndChips.mod.config.menu then
    local fish = G.P_CENTER_POOLS.fac_Fish[math.random(1,#G.P_CENTER_POOLS.fac_Fish)]

    card = Card(  card_pos.x + G.ROOM.T.w/2 - G.CARD_W*card_size/2,
                        card_pos.y + G.ROOM.T.h/2 - G.CARD_H*card_size/2,
                        card_size*G.CARD_W, card_size*G.CARD_H, G.P_CARDS.empty, G.P_CENTERS.c_base)

    card.children.center:remove()
    card.children.center = SMODS.create_sprite(card.T.x, card.T.y, card.T.w, card.T.h, fish.atlas, fish.pos or {x = 0, y = 0}, fish.sprite_args)
    card.children.center:set_role({major = card, role_type = 'Glued', draw_major = card})

    -- Check for card soul
    if fish.soul_pos then
        card.children.front = SMODS.create_sprite(card.T.x, card.T.y, card.T.w, card.T.h, fish.soul_atlas or fish.atlas, fish.soul_pos, fish.sprite_args)
        card.children.front.states.hover = card.states.hover
        card.children.front.states.click = card.states.click
        card.children.front.states.drag = card.states.drag
        card.children.front.states.collide.can = false
        card.children.front:set_role({major = card, role_type = 'Glued', draw_major = card})
    end
else
    card = Card(  card_pos.x + G.ROOM.T.w/2 - G.CARD_W*card_size/2,
                    card_pos.y + G.ROOM.T.h/2 - G.CARD_H*card_size/2,
                    card_size*G.CARD_W, card_size*G.CARD_H, pseudorandom_element(G.P_CARDS), G.P_CENTERS.c_base)
    if math.random() > 0.8 then card.sprite_facing = 'back'; card.facing = 'back' end
end
'''
match_indent = true

# Splash Card [or fish in this case]
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
SC = Card(G.ROOM.T.w/2 - SC_scale*G.CARD_W/2, 10. + G.ROOM.T.h/2 - SC_scale*G.CARD_H/2, SC_scale*G.CARD_W, SC_scale*G.CARD_H, G.P_CARDS.empty, G.P_CENTERS['j_joker'])
'''
position = "after"
payload = '''
SC = Card(G.ROOM.T.w/2 - SC_scale*G.CARD_W/2, 10. + G.ROOM.T.h/2 - SC_scale*G.CARD_H/2, SC_scale*G.CARD_W, SC_scale*G.CARD_H, G.P_CARDS.empty, G.P_CENTERS['fish_fac_splash_screen'],{bypass_discovery_center = true, bypass_discovery_ui = true})
'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = 'game.lua'
match_indent = true
pattern = '''if not G.debug_UI_toggle then '''
position = 'before'
payload = '''FishAndChips.bg_manager:draw()'''

# Background Fade from White
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
ease_value(splash_args, 'mid_flash', -(change_context == 'splash' and 1.6 or 0), nil, nil, nil, 4)
'''
position = "after"
payload = '''
if FishAndChips and FishAndChips.bg_manager then
    FishAndChips.bg_manager.splash_args = splash_args
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''
        G.VIBRATION = G.VIBRATION + 1
        return true
end)}))
'''
position = 'after'
payload = '''

FishAndChips.init_custom_menu(change_context)
'''
match_indent = true
