[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = '''functions/common_events.lua'''
pattern = '''elseif _c.set == 'Back' or _c.set == 'Blind' then localize{type = 'descriptions', key = _c.key, set = _c.set, nodes = desc_nodes, vars = specific_vars or {}}'''
position = "before"
payload = '''
if cfg.crimsonseraphim_forged then
    local str = FishAndChips.crimsonseraphim.create_forge_text(cfg)
    if str then
        FishAndChips.crimsonseraphim.generate_ui_multiboxes({
            {localized_text = str}
        })(_c, info_queue, card, desc_nodes, specific_vars, full_UI_table)
    end
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = '''functions/common_events.lua'''
pattern = '''if not hide_desc and card and card.ability and (card.ability.extra_slots_used or 0) ~= 0 then'''
position = "before"
payload = '''

if cfg and cfg.fish_seal then
    local seal = FishAndChips.crimsonseraphim.fish_seals[cfg.fish_seal.key]
    local t = {key = string.lower(cfg.fish_seal.key).."_fish_seal", set = 'Other', config = {}}
    if seal.loc_vars and type(seal.loc_vars) == 'function' then
        local res = seal:loc_vars(info_queue, card) or {}
        t.vars = res.vars
        t.key = res.key or t.key
        t.set = res.set or t.set
    end
    info_queue[#info_queue+1] = t
end
'''
match_indent = true
