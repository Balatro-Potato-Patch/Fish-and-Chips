# Starting Param.

[[patches]]
[patches.pattern]
target = "back.lua"
pattern = "if self.effect.config.dollars then"
position = "before"
payload = '''
if self.effect.config.fac_sand_dollars then
    G.GAME.starting_params.fac_sand_dollars = (G.GAME.starting_params.fac_sand_dollars or 0) + self.effect.config.fac_sand_dollars
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self.GAME.dollars = self.GAME.starting_params.dollars"
position = "after"
payload = '''self.GAME.fac_sand_dollars = (self.GAME.starting_params.fac_sand_dollars or 0)'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "dollars = 4,"
position = "after"
payload = '''fac_sand_dollars = 0,'''
match_indent = true
