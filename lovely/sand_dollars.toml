[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

# Original FAC Code

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''
self.GAME.dollars = self.GAME.starting_params.dollars
'''
position = 'after'
payload = '''
self.GAME.fac_sand_dollars = self.GAME.starting_params.fac_sand_dollars
'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/utils.lua"]'''
pattern = '''
if (key == 'p_dollars' or key == 'dollars' or key == 'h_dollars') and amount then
'''
position = 'before'
payload = '''
if (key == 'p_fac_sand_dollars' or key == 'sand_dollars' or key == 'h_fac_sand_dollars') and amount then
    if effect.card and effect.card ~= scored_card then juice_card(effect.card) end
    ease_sand_dollars(amount, effect.instant)
    if not effect.remove_default_message then
        if effect.dollar_message then
            card_eval_status_text(effect.message_card or effect.juice_card or scored_card or effect.card or effect.focus, 'extra', nil, percent, nil, dollar_message)
        else
            card_eval_status_text(effect.message_card or effect.juice_card or scored_card or effect.card or effect.focus, 'sand_dollars', amount, percent)
        end
    end
    return true
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''
elseif eval_type == 'dollars' then
'''
position = 'before'
payload = '''
elseif eval_type == 'sand_dollars' then 
    sound = 'coin3'
    amt = amt
    text = (amt <-0.01 and '-' or '')..localize("$")..tostring(math.abs(amt))
    colour = amt <-0.01 and G.C.RED or FishAndChips.C.SAND_DOLLAR
    extra = extra or {}
    extra.font = 'fac_sand_dollars'
'''
match_indent = true

# Add sand dollars on cashout (shamelessly taken from hotpot)
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
position = "before"
pattern = "add_round_eval_row({name = 'bottom', dollars = dollars})"
payload = """
-- Add Sand Dollars
local FAC_CASHOUT_REWARD = { Small = 1, Big = 2, Boss = 3 }

local sand_dollars_to_add = FAC_CASHOUT_REWARD[G.GAME.blind_on_deck] or FAC_CASHOUT_REWARD.Small

add_round_eval_sand_dollars({name='sand_dollars', pitch = pitch, sand_dollars = sand_dollars_to_add})
sand_dollars = sand_dollars + sand_dollars_to_add

"""
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
position = "after"
pattern = "ease_dollars(G.GAME.current_round.dollars)"
payload = """
ease_sand_dollars(G.GAME.current_round.fac_sand_dollars)
G.GAME.current_round.fac_sand_dollars = 0
"""
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "local dollars = 0"
position = "after"
payload = '''
local sand_dollars = 0
'''
match_indent = true

# Perma Bonuses:

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "perma_h_dollars = self.ability and self.ability.perma_h_dollars or 0,"
position = "after"
payload = '''
perma_p_fac_sand_dollars = self.ability and self.ability.perma_p_fac_sand_dollars or 0,
perma_h_fac_sand_dollars = self.ability and self.ability.perma_h_fac_sand_dollars or 0,
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "bonus_h_dollars = self.ability.perma_h_dollars ~= 0 and self.ability.perma_h_dollars or nil,"
position = "after"
payload = '''
bonus_p_fac_sand_dollars = self.ability.perma_p_fac_sand_dollars ~= 0 and self.ability.perma_p_fac_sand_dollars or nil,
bonus_h_fac_sand_dollars = self.ability.perma_h_fac_sand_dollars ~= 0 and self.ability.perma_h_fac_sand_dollars or nil,
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "p_dollars = center.config.p_dollars or 0,"
position = "after"
payload = '''
h_fac_sand_dollars = center.config.h_fac_sand_dollars or 0,
p_fac_sand_dollars = center.config.p_fac_sand_dollars or 0,
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "local x_chips = card:get_chip_x_bonus()"
position = "before"
payload = '''
local p_fac_sand_dollars = card:get_p_fac_sand_dollars()
if p_fac_sand_dollars ~= 0 then
    ret.playing_card.p_fac_sand_dollars = p_fac_sand_dollars
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if self.extra_enhancement then return ret end"
position = "before"
payload = '''
local h_fac_sand_dollars = self:get_h_fac_sand_dollars()
if h_fac_sand_dollars ~= 0 then
    ret.h_fac_sand_dollars = h_fac_sand_dollars
    ret.card = self
end
'''
match_indent = true

