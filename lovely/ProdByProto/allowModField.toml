[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/game_object.lua"]'
pattern = '''
        assert(o.mod == nil, "Created object should not have \"mod\" field defined.")
        o.mod = SMODS.current_mod
'''
position = "at"
payload = '''
if not o.mod == SMODS.Mods["FishAndChips"] then assert(o.mod == nil, "Created object should not have \"mod\" field defined.") end
o.mod = o.mod or SMODS.current_mod
'''
match_indent = true